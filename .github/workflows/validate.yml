name: Validate Routing Rules
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/rules.py build
      - run: python scripts/rules.py check
      - run: python -m unittest discover -s tests -v
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: routing-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/rules.py build
      - name: Publish validated data to release branch
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          set -eu
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$SOURCE_COMMIT" ]; then
            echo 'A newer main revision exists; skip this publication.'
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('publication.json').write_text(json.dumps({
              'schema': 1,
              'source_commit': os.environ['SOURCE_COMMIT'],
              'workflow_run': int(os.environ['WORKFLOW_RUN']),
          }, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json dist/quantumult-x publication.json
          tree=$(git write-tree)
          previous=$(git ls-remote origin refs/heads/release | cut -f1)
          if [ -n "$previous" ]; then
            git fetch --depth=1 origin "$previous"
            commit=$(printf 'Publish rules from %s\n' "$SOURCE_COMMIT" | git commit-tree "$tree" -p "$previous" -p "$SOURCE_COMMIT")
          else
            commit=$(printf 'Publish rules from %s\n' "$SOURCE_COMMIT" | git commit-tree "$tree" -p "$SOURCE_COMMIT")
          fi
          git push origin "$commit:refs/heads/release"
