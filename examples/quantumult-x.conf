# Merge into the existing [filter_remote] section, not a full configuration.
# Replace PROXY and RESIDENTIAL with existing policy names on the device.
# Preserve local management/DNS/LAN exceptions; verify ordering on that device.
[filter_remote]
https://raw.githubusercontent.com/dneo9527-ctrl/proxy-routing-rules/main/dist/quantumult-x/reject.list, tag=PersonalReject, force-policy=reject, update-interval=300, enabled=true
https://raw.githubusercontent.com/dneo9527-ctrl/proxy-routing-rules/main/dist/quantumult-x/direct.list, tag=PersonalDirect, force-policy=direct, update-interval=300, enabled=true
https://raw.githubusercontent.com/dneo9527-ctrl/proxy-routing-rules/main/dist/quantumult-x/residential.list, tag=PersonalResidential, force-policy=RESIDENTIAL, update-interval=300, enabled=true
https://raw.githubusercontent.com/dneo9527-ctrl/proxy-routing-rules/main/dist/quantumult-x/proxy.list, tag=PersonalProxy, force-policy=PROXY, update-interval=300, enabled=true
